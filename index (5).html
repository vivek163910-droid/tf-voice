<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Voice</title>
<style>
  :root{--ink:#0B1220;--muted:#667085;--paper:#F4F5F0;--card:#fff;--teal:#226358;--teal-soft:#E1EFEC;--gold:#C2921F;--gold-soft:#FBF1D9;--danger:#B8402A;--border:#E1E3DC}
  @media (prefers-color-scheme:dark){:root{--ink:#F1F3F6;--muted:#9AA4B2;--paper:#10141B;--card:#181D26;--teal:#4FB3A0;--teal-soft:rgba(79,179,160,.16);--gold-soft:rgba(224,179,85,.14);--border:#2A3340}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,-apple-system,"Segoe UI",sans-serif}
  main{display:flex;flex-direction:column;gap:12px;height:100%;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  header b{font-size:15px}
  #conn{font:600 11px/1 ui-monospace,Menlo,monospace;padding:5px 9px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
  #conn.ok{background:var(--teal-soft);color:var(--teal)}
  #conn.bad{background:#f7e3dd;color:var(--danger)}
  #orb{align-self:center;width:128px;height:128px;border-radius:50%;border:0;cursor:pointer;background:var(--card);box-shadow:0 0 0 1px var(--border),0 10px 30px rgba(0,0,0,.08);display:grid;place-items:center;transition:transform .15s}
  #orb:active{transform:scale(.97)}
  #orb svg{width:44px;height:44px;color:var(--muted)}
  #orb.listening{background:var(--teal);box-shadow:0 0 0 8px var(--teal-soft),0 0 0 18px rgba(34,99,88,.07)}
  #orb.listening svg{color:#fff}
  #orb.listening{animation:pulse 1.8s ease-in-out infinite}
  #orb.sleeping{background:var(--gold-soft)}
  #orb.sleeping svg{color:var(--gold)}
  #orb.speaking{background:var(--ink)}
  #orb.speaking svg{color:var(--paper)}
  @keyframes pulse{50%{box-shadow:0 0 0 12px var(--teal-soft),0 0 0 26px rgba(34,99,88,.05)}}
  #state{text-align:center;margin:0;font-weight:600}
  .bubble{min-height:44px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:13px;white-space:pre-wrap;word-break:break-word}
  .bubble small{display:block;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  #heard .t{color:var(--muted)}
  #heard.final .t{color:var(--ink)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--ink)}
  .tips{margin:auto 0 0;font-size:11.5px;color:var(--muted)}
  .tips b{color:var(--ink)}
</style>
</head>
<body>
<main>
  <header><b>Finance Voice</b><span id="conn">Connecting…</span></header>
  <button id="orb" type="button" aria-label="Start or stop listening">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11.5C5.5 15.1 8.4 18 12 18s6.5-2.9 6.5-6.5M12 18v3M9 21h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <p id="state">Click the circle once to start</p>
  <div id="heard" class="bubble"><small>You said</small><span class="t">—</span></div>
  <div id="said" class="bubble"><small>App</small><span class="t">—</span></div>
  <div class="row">
    <label>Language
      <select id="lang">
        <option value="en-IN">English (India)</option>
        <option value="hi-IN">Hindi / Hinglish</option>
      </select>
    </label>
    <label><input type="checkbox" id="speakOn" checked> Speak replies</label>
  </div>
  <p class="tips">Keep this small window open beside the app (not minimised).<br>
    Say <b>“sleep”</b> to pause, <b>“wake up”</b> to resume.<br>
    Anything that sends or saves is read back first — say <b>“yes”</b> or <b>“cancel”</b>.</p>
</main>

<script>
(function () {
  'use strict';
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var $ = function (id) { return document.getElementById(id); };
  var orb = $('orb'), stateEl = $('state'), conn = $('conn');
  var rec = null, want = false, running = false, sleeping = false, speaking = false, blocked = false;
  var lang = load('tfv_lang', 'en-IN'), speakOn = load('tfv_speak', '1') === '1';

  function load(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function keep(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  $('lang').value = lang;
  $('speakOn').checked = speakOn;
  $('lang').onchange = function () { lang = this.value; keep('tfv_lang', lang); restart(); };
  $('speakOn').onchange = function () { speakOn = this.checked; keep('tfv_speak', speakOn ? '1' : '0'); if (!speakOn) speechSynthesis.cancel(); };

  /* ---------- link to the app window ---------- */
  function appAlive() { try { return !!window.opener && !window.opener.closed; } catch (e) { return false; } }
  function post(msg) {
    if (!appAlive()) return setConn('bad');
    msg.src = 'tf-voice-bridge';
    try { window.opener.postMessage(msg, '*'); } catch (e) { setConn('bad'); }
  }
  function setConn(s) {
    conn.className = s === 'ok' ? 'ok' : s === 'bad' ? 'bad' : '';
    conn.textContent = s === 'ok' ? 'Connected' : s === 'bad' ? 'App closed' : 'Connecting…';
    if (s === 'bad') { show('App window was closed or reloaded. Click the mic in the app to reconnect.'); }
  }
  setInterval(function () { if (!appAlive()) setConn('bad'); }, 3000);

  window.addEventListener('message', function (e) {
    if (!appAlive() || e.source !== window.opener) return;   // only our app may talk to us
    var d = e.data || {};
    if (d.src !== 'tf-voice-app') return;
    setConn('ok');
    if (d.type === 'TF_SPEAK') { $('said').querySelector('.t').textContent = d.text || ''; speak(d.text || ''); }
    else if (d.type === 'TF_HELLO') { post({ type: 'TF_VOICE_READY', lang: lang }); }
  });

  /* ---------- UI ---------- */
  function show(msg) { stateEl.textContent = msg; }
  function paint() {
    orb.className = speaking ? 'speaking' : sleeping ? 'sleeping' : running ? 'listening' : '';
    if (blocked) return;
    show(speaking ? 'Speaking…' : sleeping ? 'Sleeping — say “wake up”' : running ? 'Listening…' : 'Click the circle to start');
  }
  function heard(text, final) {
    var h = $('heard'); h.classList.toggle('final', !!final); h.querySelector('.t').textContent = text || '—';
  }

  /* ---------- speech recognition ---------- */
  function start() {
    if (!SR) { blocked = true; show('This browser has no speech recognition. Use Chrome or Edge.'); return; }
    want = true; blocked = false;
    if (running || speaking) return;
    rec = new SR();
    rec.lang = lang;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onstart = function () { running = true; paint(); post({ type: 'TF_VOICE_STATE', state: sleeping ? 'sleeping' : 'listening' }); };
    rec.onresult = function (ev) {
      var fin = '', interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) fin += t; else interim += t;
      }
      if (interim && !sleeping) { heard(interim, false); post({ type: 'TF_VOICE_INTERIM', text: interim }); }
      if (fin) onFinal(fin.trim());
    };
    rec.onerror = function (ev) {
      var c = ev && ev.error;
      if (c === 'not-allowed' || c === 'service-not-allowed') {
        want = false; blocked = true;
        show('Microphone not allowed. Click the circle, then choose “Allow” for the microphone.');
      } else if (c === 'audio-capture') {
        want = false; blocked = true; show('No microphone found. Plug one in and click the circle.');
      } else if (c === 'network') {
        show('Speech service unreachable. Check the internet connection.');
      } // 'no-speech' and 'aborted' are normal — ignored
    };
    rec.onend = function () {
      running = false; paint();
      if (want && !speaking) setTimeout(function () { if (want && !running && !speaking) start(); }, 300);
    };
    try { rec.start(); } catch (e) {}
  }
  function stop() { want = false; try { rec && rec.abort(); } catch (e) {} running = false; paint(); post({ type: 'TF_VOICE_STATE', state: 'stopped' }); }
  function restart() { if (!want) return; try { rec && rec.abort(); } catch (e) {} }  // onend restarts with new language

  var WAKE = /\b(wake up|wakeup|utho|jaago|jago|hello finance|hey finance|start listening)\b/i;
  var SLEEP = /^(please )?(sleep|go to sleep|pause|pause listening|stop listening|so jao|chup)\b/i;

  function onFinal(text) {
    if (!text) return;
    if (sleeping) {
      if (WAKE.test(text)) { sleeping = false; paint(); say('I am listening.'); post({ type: 'TF_VOICE_STATE', state: 'listening' }); }
      return;                                   // ignore everything else while asleep
    }
    if (SLEEP.test(text)) { sleeping = true; paint(); say('Paused. Say wake up when you need me.'); post({ type: 'TF_VOICE_STATE', state: 'sleeping' }); return; }
    heard(text, true);
    post({ type: 'TF_VOICE_FINAL', text: text, lang: lang });
  }

  /* ---------- speaking (recognition pauses so it does not hear itself) ---------- */
  function say(text) { $('said').querySelector('.t').textContent = text; speak(text); }
  function speak(text) {
    if (!speakOn || !text || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = /[\u0900-\u097F]/.test(text) ? 'hi-IN' : 'en-IN';
    var v = speechSynthesis.getVoices().filter(function (x) { return x.lang === u.lang; })[0];
    if (v) u.voice = v;
    u.rate = 1.05;
    speaking = true; try { rec && rec.abort(); } catch (e) {} paint();
    var done = function () { speaking = false; paint(); if (want && !running) start(); };
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  }

  orb.onclick = function () { if (running || want) stop(); else { sleeping = false; start(); } };

  /* ---------- start ---------- */
  if (appAlive()) { setConn('ok'); post({ type: 'TF_VOICE_READY', lang: lang }); } else setConn('bad');
  start();          // works straight away once the microphone has been allowed for this site
})();
</script>
</body>
</html>
